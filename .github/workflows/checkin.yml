name: HoYoLAB Daily Check-in

on:
  schedule:
    # 16:00 UTC equivale a las 13:00 (1:00 PM) UTC-3 (Argentina, Chile, Uruguay)
    - cron: '0 16 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un botón

jobs:
  checkin:
    name: Run Daily Check-in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Check-in
        env:
          HOYOLAB_COOKIE: ${{ secrets.HOYOLAB_COOKIE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
